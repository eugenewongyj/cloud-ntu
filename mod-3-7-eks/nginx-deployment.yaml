apiVersion: apps/v1
kind: Deployment
metadata:
  name: eugene-nginx-deployment #<your-name>-nginx-deployment
  namespace: eugene-eks-activity #<your-namespace>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80